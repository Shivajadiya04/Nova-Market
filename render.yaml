# Render Blueprint: deploys the whole application from this GitHub repository.
# Render dashboard -> New -> Blueprint -> pick this repo. See README "Deploying to Render".
#
#   Internet --HTTPS--> gateway (public web service: React app + /api proxy)
#                          | Render private network (host:port, not reachable from the internet)
#                          v
#        auth  product  cart  order  payment  seller-dashboard  ai-buddy   (private services)
#        notification (background worker)       nova-redis (Key Value, revoked tokens)
#   External (you create the accounts): MongoDB Atlas, CloudAMQP (RabbitMQ), Razorpay,
#   ImageKit, Gmail OAuth2, Google Gemini.
#
# Private services and workers have no free plan on Render: this layout needs paid instances
# (see README for the cost estimate). Values marked `sync: false` are asked for when the
# Blueprint is first created and are never stored in this file.

envVarGroups:
  - name: nova-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_MOCK_DB
        value: "false"
      - key: NODE_VERSION
        value: "22"
      # Generated once by Render (256-bit random) and shared by every service
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true

services:
  # ---------------- public entry point ----------------
  - type: web
    name: gateway
    runtime: node
    plan: starter
    region: singapore
    # --include=dev: NODE_ENV=production would otherwise skip Vite, which the build needs
    buildCommand: npm ci --include=dev --prefix frontend && npm run build --prefix frontend && npm ci --omit=dev --prefix gateway
    startCommand: node gateway/server.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - gateway/**
        - frontend/**
    envVars:
      - fromGroup: nova-shared
      - key: AUTH_SERVICE_URL
        fromService: { name: auth, type: pserv, property: hostport }
      - key: PRODUCT_SERVICE_URL
        fromService: { name: product, type: pserv, property: hostport }
      - key: CART_SERVICE_URL
        fromService: { name: cart, type: pserv, property: hostport }
      - key: ORDER_SERVICE_URL
        fromService: { name: order, type: pserv, property: hostport }
      - key: PAYMENT_SERVICE_URL
        fromService: { name: payment, type: pserv, property: hostport }
      - key: SELLER_DASHBOARD_SERVICE_URL
        fromService: { name: seller-dashboard, type: pserv, property: hostport }
      - key: AI_BUDDY_SERVICE_URL
        fromService: { name: ai-buddy, type: pserv, property: hostport }

  # ---------------- private backend services ----------------
  - type: pserv
    name: auth
    runtime: node
    plan: starter
    region: singapore
    rootDir: auth
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    autoDeployTrigger: commit
    envVars:
      - fromGroup: nova-shared
      - key: MONGO_URI
        sync: false
      - key: RABBIT_URL
        sync: false
      - key: REDIS_URL
        fromService: { name: nova-redis, type: keyvalue, property: connectionString }

  - type: pserv
    name: product
    runtime: node
    plan: starter
    region: singapore
    rootDir: product
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    autoDeployTrigger: commit
    envVars:
      - fromGroup: nova-shared
      - key: MONGO_URI
        sync: false
      - key: RABBIT_URL
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false

  - type: pserv
    name: cart
    runtime: node
    plan: starter
    region: singapore
    rootDir: cart
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    autoDeployTrigger: commit
    envVars:
      - fromGroup: nova-shared
      - key: MONGO_URI
        sync: false

  - type: pserv
    name: order
    runtime: node
    plan: starter
    region: singapore
    rootDir: order
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    autoDeployTrigger: commit
    envVars:
      - fromGroup: nova-shared
      - key: MONGO_URI
        sync: false
      - key: RABBIT_URL
        sync: false
      - key: CART_SERVICE_URL
        fromService: { name: cart, type: pserv, property: hostport }
      - key: PRODUCT_SERVICE_URL
        fromService: { name: product, type: pserv, property: hostport }

  - type: pserv
    name: payment
    runtime: node
    plan: starter
    region: singapore
    rootDir: payment
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    autoDeployTrigger: commit
    envVars:
      - fromGroup: nova-shared
      - key: MONGO_URI
        sync: false
      - key: RABBIT_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ORDER_SERVICE_URL
        fromService: { name: order, type: pserv, property: hostport }

  - type: pserv
    name: seller-dashboard
    runtime: node
    plan: starter
    region: singapore
    rootDir: seller-dashboard
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    autoDeployTrigger: commit
    envVars:
      - fromGroup: nova-shared
      - key: MONGO_URI
        sync: false
      - key: RABBIT_URL
        sync: false

  - type: pserv
    name: ai-buddy
    runtime: node
    plan: starter
    region: singapore
    rootDir: ai-buddy
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    autoDeployTrigger: commit
    envVars:
      - fromGroup: nova-shared
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: PRODUCT_SERVICE_URL
        fromService: { name: product, type: pserv, property: hostport }
      - key: CART_SERVICE_URL
        fromService: { name: cart, type: pserv, property: hostport }

  # Consumes RabbitMQ events and sends email; needs no inbound traffic
  - type: worker
    name: notification
    runtime: node
    plan: starter
    region: singapore
    rootDir: notification
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    autoDeployTrigger: commit
    envVars:
      - fromGroup: nova-shared
      - key: RABBIT_URL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: REFRESH_TOKEN
        sync: false

  # ---------------- Redis: revoked-token store for server-side logout ----------------
  - type: keyvalue
    name: nova-redis
    plan: free
    region: singapore
    # Never evict: an evicted entry would make a logged-out token valid again
    maxmemoryPolicy: noeviction
    # Empty list = no access from outside Render; services connect over the private network
    ipAllowList: []
